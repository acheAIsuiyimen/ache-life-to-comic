schema_version: "1.1.0"
platform: "trae"
status: "portable_contract"
canonical_skill: "../.."
packaging:
  strategy: "copy-canonical-skill-and-bind-native-capabilities"
capability_probe:
  image_generation: "detect_at_runtime"
  image_editing: "detect_at_runtime"
  local_file_write: "detect_at_runtime"
  browser_render: "detect_at_runtime"
  feishu_connection: "detect_at_runtime"
  presentation: "detect_at_runtime"
presentation_policy:
  ordered_modes: ["native-image-attachment", "native-file-preview", "html-artifact", "local-preview"]
  invented_tool_names_forbidden: true
  required_visual_receipt: "displayed"
rendering:
  entrypoint: "scripts/page-renderer.mjs"
  stylesheet: "assets/templates/page-system.css"
  platform_freehand_html_forbidden: true
image_policy:
  provider_binding: false
  use_platform_native_default: true
  missing_capability: ["enable-native", "light-illustration", "visual-pending"]
data_contract:
  profile: "publication-profile.json"
  monthly_serial: "monthly-volumes/YYYY-MM/continuous-edition"
  visual_job: "provider-neutral"
publication:
  default: "local-html"
  portable_share: ["light", "faithful", "skip"]
  portable_share_entrypoint: "scripts/portable-export.mjs"
  external_write_requires_explicit_authorization: true
feishu:
  verified_personal_identity_required: true
  unknown_identity_action: "identity_confirmation_required"
