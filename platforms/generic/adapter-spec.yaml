schema_version: "1.1.0"
platform: "generic-agent-workspace"
status: "portable_contract"
canonical_skill: "../.."
minimum_runtime:
  markdown_instruction_support: true
  json_file_support: true
  node_esm: "recommended"
capability_probe:
  image_generation: "detect_at_runtime"
  local_file_write: "required_for_persistent_serial"
  presentation: "detect_at_runtime"
presentation_policy:
  ordered_modes: ["native-image-attachment", "native-file-preview", "html-artifact", "local-preview"]
  invented_tool_names_forbidden: true
  required_visual_receipt: "displayed"
rendering:
  entrypoint: "scripts/page-renderer.mjs"
  stylesheet: "assets/templates/page-system.css"
  platform_freehand_html_forbidden: true
image_policy:
  provider_binding: false
  missing_capability: ["light-illustration", "visual-pending"]
publication:
  supported_core: ["local-html"]
  optional_adapters: ["feishu", "github"]
  external_write_requires_explicit_authorization: true
feishu:
  ache_project_identity_required: "felix"
  unknown_identity_action: "identity_confirmation_required"
