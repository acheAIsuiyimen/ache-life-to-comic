schema_version: "comic-life-preset/1.0"
lifecycle: optional_candidate
preset:
  id: "04-two-color-line"
  name_zh: "双色线记"
  version: "1.0.0"
  selector_cover: "cover.png"
output:
  background: "#FFFFFF"
  white_area_ratio: [0.75, 0.90]
style:
  medium: "loose intelligent two-color line drawing"
  palette:
    - vermilion
    - charcoal_black
    - optional_pale_mint
  character: "mature with subtle scale distortion"
  strengths:
    - idea
    - emotion
    - visual_metaphor
  forbidden:
    - beige_full_page_ground
    - childlike_doodle
    - dense_decoration
    - generated_text
calibration:
  required_on_first_book_use: true
  deliverables:
    - episode_cover
    - standard_page
