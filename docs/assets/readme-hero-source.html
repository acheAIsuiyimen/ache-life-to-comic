<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ache life-to-comic</title>
  <style>
    @font-face{font-family:ache-note;src:url("../../assets/fonts/LXGWWenKaiGBScreen.ttf")}
    @font-face{font-family:ache-display;src:url("../../assets/fonts/SmileySans-Oblique.woff2")}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    body{font-family:ache-note,"Kaiti SC",serif;color:#202b37}
    .stage{
      position:relative;width:100%;height:100%;overflow:hidden;
      background:
        radial-gradient(circle at 13% 18%,rgba(120,168,220,.12),transparent 24%),
        radial-gradient(circle at 94% 86%,rgba(201,99,85,.08),transparent 22%),
        #fff;
    }
    .stage::before{
      content:"";position:absolute;inset:0;opacity:.16;
      background-image:radial-gradient(#91a0ae .55px,transparent .7px);
      background-size:31px 35px;pointer-events:none;
    }
    .copy{position:absolute;left:6.6%;top:8.5%;width:47%;z-index:5}
    .eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 32px;font-size:17px;color:#667487}
    .eyebrow::before{content:"";width:48px;height:4px;border-radius:9px;background:#78a8dc;transform:rotate(-2deg)}
    h1{margin:0;font-family:ache-display,serif;font-size:clamp(58px,7.2vw,98px);font-weight:400;line-height:.92;letter-spacing:.005em}
    h1 span{display:block}
    .lead{max-width:560px;margin:30px 0 0;font-size:25px;line-height:1.55}
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
    .chip{padding:8px 13px;border:1px solid #cbdced;background:rgba(255,255,255,.88);font-size:15px;transform:rotate(-.6deg)}
    .chip:nth-child(2){transform:rotate(.7deg);border-color:#e2c4be}
    .chip:nth-child(3){transform:rotate(-.2deg);border-color:#dccb9e}
    .door{
      position:absolute;right:4.2%;top:3.7%;width:43%;height:92%;z-index:2;
      border:2px solid #dbe7f3;border-radius:48% 48% 7% 7% / 14% 14% 5% 5%;
      background:linear-gradient(155deg,#f9fcff 0 56%,#eef6fd 100%);
      box-shadow:inset 0 0 0 12px rgba(255,255,255,.84);
    }
    .door::after{content:"";position:absolute;left:11%;right:11%;bottom:5%;height:2px;background:#78a8dc;opacity:.45;transform:rotate(-1deg)}
    .page{
      position:absolute;width:36%;aspect-ratio:3/4;overflow:hidden;background:#fff;border:1px solid #dbe7f3;
      box-shadow:0 18px 42px rgba(62,84,105,.13);
      transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .55s ease;
    }
    .page img{width:100%;height:100%;object-fit:cover}
    .p1{left:9%;top:13%;transform:translate(-6%,4%) rotate(-6deg)}
    .p2{left:34%;top:21%;transform:translate(2%,1%) rotate(3deg)}
    .p3{right:8%;top:10%;transform:translate(3%,6%) rotate(7deg)}
    body[data-step="0"] .p2,body[data-step="0"] .p3{opacity:0;transform:translate(25%,18%) rotate(12deg)}
    body[data-step="1"] .p1{transform:translate(-15%,12%) rotate(-9deg)}
    body[data-step="1"] .p3{opacity:0;transform:translate(25%,18%) rotate(12deg)}
    body[data-step="2"] .p1{transform:translate(-20%,15%) rotate(-10deg)}
    body[data-step="2"] .p2{transform:translate(-2%,4%) rotate(1deg)}
    body[data-step="3"] .p1{transform:translate(-20%,15%) rotate(-10deg)}
    body[data-step="3"] .p2{transform:translate(-3%,4%) rotate(1deg)}
    body[data-step="3"] .p3{transform:translate(-1%,5%) rotate(6deg)}
    .cat{position:absolute;right:1.5%;bottom:-1%;width:17%;z-index:8;filter:drop-shadow(0 8px 12px rgba(39,50,61,.12))}
    .scribble{position:absolute;left:52%;bottom:5.5%;z-index:9;color:#c96355;font-size:19px;transform:rotate(-4deg)}
    .scribble::after{content:"";display:block;width:106px;height:16px;border-bottom:3px solid #c96355;border-radius:50%;opacity:.65}
    @media (max-width:760px){
      .copy{width:53%;left:5%;top:7%}.lead{font-size:18px}.chips{gap:6px;margin-top:20px}.chip{font-size:12px}
      .door{right:2%;width:46%}.cat{width:19%}
    }
  </style>
</head>
<body data-step="3">
  <main class="stage">
    <section class="copy">
      <p class="eyebrow">ACHE LIFE-TO-COMIC · 漫画人生连载</p>
      <h1><span>把今天，</span><span>收进漫画里。</span></h1>
      <p class="lead">一句话、一张照片、一段会议，或者一篇不想改的长文。第一次创刊后，接下来只管发来。</p>
      <div class="chips">
        <span class="chip">每次有封面</span>
        <span class="chip">按月成册</span>
        <span class="chip">让自己的 IP 路过</span>
      </div>
    </section>
    <section class="door" aria-label="一本正在长大的漫画书">
      <figure class="page p1"><img src="../../assets/presets/02-snow-pastel/golden/cover-environment-transformation.png" alt=""></figure>
      <figure class="page p2"><img src="../../assets/presets/02-snow-pastel/golden/photo-page.png" alt=""></figure>
      <figure class="page p3"><img src="../../assets/presets/02-snow-pastel/golden/cover-typography-in-scene.png" alt=""></figure>
    </section>
    <img class="cat" src="../../assets/characters/66-dawang/anchor.png" alt="66 大王">
    <span class="scribble">书会自己长大一点</span>
  </main>
</body>
</html>
